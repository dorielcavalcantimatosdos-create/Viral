<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viral</title>
<style>
:root{--y:#FFD60A;--p:#161616;--l:#2e2e2e;--m:#a9a9a9}
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:15px/1.5 system-ui,sans-serif}
.tape{height:10px;background:repeating-linear-gradient(-45deg,var(--y) 0 14px,#000 14px 28px)}
h1,h2,h3{font-family:'Arial Narrow','Roboto Condensed',Impact,sans-serif;margin:.3em 0}h1{font-size:26px;padding:6px 12px}
nav{display:flex;gap:4px;padding:8px;position:sticky;top:0;background:#000;border-bottom:1px solid var(--l);z-index:5;overflow-x:auto}
nav button{flex:1;white-space:nowrap;background:var(--p);color:#fff;border:1px solid var(--l);padding:10px 12px;border-radius:4px;font:inherit}
nav .on{background:var(--y);color:#000;font-weight:700}
main{max-width:760px;margin:auto;padding:12px}
.card{background:var(--p);border-left:4px solid var(--y);padding:12px;margin:10px 0}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--l);text-align:left;vertical-align:top}
button.p{background:var(--y);color:#000;border:0;padding:10px 14px;font:inherit;font-weight:700;border-radius:4px;margin:4px 4px 4px 0}
button.s{background:none;color:var(--y);border:1px solid var(--y);padding:8px 12px;font:inherit;border-radius:4px;margin:4px 4px 4px 0}
input,textarea,select{width:100%;background:#000;color:#fff;border:1px solid #555;padding:9px;border-radius:4px;font:inherit;margin:4px 0}
.k{color:var(--m);font-size:13px}.bad{color:#ff7b7b}.ok{color:#7ee787}.y{color:var(--y)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
#t{position:fixed;bottom:12px;left:12px;right:12px;background:var(--y);color:#000;padding:10px;border-radius:4px;font-weight:700;display:none;z-index:9}
a{color:var(--y)}:focus-visible{outline:2px solid var(--y);outline-offset:2px}
</style></head><body>
<div class="tape"></div><h1>Viral</h1><nav id="n"></nav><main id="a"></main><div id="t"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K='viral2';let D;try{D=JSON.parse(localStorage.getItem(K))}catch{}D=D&&Array.isArray(D.i)?D:{i:[]};
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.x);toast.x=setTimeout(()=>t.style.display='none',4000)}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch{toast('Não consegui salvar neste navegador.')}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),today=()=>new Date().toISOString().slice(0,10);
const ageD=d=>(Date.now()-new Date(d+'T12:00:00'))/864e5,find=id=>D.i.find(x=>x.id===id);
const med=a=>{a=a.filter(x=>x!=null).sort((x,y)=>x-y);if(!a.length)return null;const h=a.length>>1;return a.length%2?a[h]:(a[h-1]+a[h])/2};
const num=s=>{const x=String(s??'').replace(/\s|%/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.');if(x==='')return null;const n=+x;return isNaN(n)||n<0?null:n};
const wd=t=>(String(t).toLowerCase().match(/[\p{L}\d]{4,}/gu)||[]);
const copy=t=>navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast('Copiado.'),()=>toast('Não consegui copiar.')):toast('Copie manualmente.');
const ST=['ideia','roteiro','gravado','publicado'],PL=['YouTube Shorts','Facebook Reels'];
const FM=['Degraus crescentes (cada etapa mais forte)','Resultado só no final','Desafio com tempo ou limite','Antes e depois','Lista (X coisas)','Outro'];
const VA=['Gancho (3 primeiros s)','Título','Capa ou primeiro frame','Meio (virada e ritmo)','Formato','Tema','Nada (primeiro teste)'];
const opts=(a,s)=>a.map(x=>`<option${x===s?' selected':''}>${E(x)}</option>`).join('');
const blank=()=>({t:'',th:'',cc:'',ng:'',fm:FM[0],va:VA[6]});
let tab=0,F=blank(),R={id:'',txt:'',du:'30'},P={id:'',pl:PL[0],d:today(),du:'30'};

/* 1. IDEIA: título, capa e promessa antes de produzir */
const EXT=/sobrevi|nunca|pior|melhor|maior|menor|imposs[ií]vel|proibid|segredo|erro|ningu[eé]m|extrem|perigos|loucur|verdade|mentira|golpe|quebr|perdi|arrisc|absurd|bizarr|milh/i;
function evT(f){const t=f.t.trim();if(!t)return null;const r=[],a=(ok,pt,y,n)=>r.push({ok,pt,m:ok?y:n});
a(t.length>=18&&t.length<=60,1,`Tamanho bom (${t.length} caracteres).`,`Tamanho ${t.length}: use de 18 a 60 caracteres para ler no celular.`);
a(EXT.test(t),2,'Tem termo extremo ou de risco.','Sem extremo. "Gastei 50 reais" perde para "Sobrevivi com 50 reais": vá ao extremo que você consegue entregar.');
a(/\d/.test(t),1,'Tem número ou escala.','Sem número. Escala concreta (100, 24 horas, 1 milhão) ajuda o clique.');
a(/\?|por que|porque|o que|ningu[eé]m|segredo|verdade|nunca/i.test(t),2,'Abre uma pergunta que só o vídeo responde.','Não abre curiosidade. Faça o espectador precisar do final para saber a resposta.');
a(!/\b(dicas?|sobre|algumas?|coisas?|um pouco|geral)\b/i.test(t),1,'Título concreto.','Termo vago (dicas, sobre, coisas): troque por algo que dê para visualizar.');
a(f.th.trim().length>3,1,'Capa ou primeiro frame definido.','Sem capa/primeiro frame: a expectativa do espectador fica solta.');
a(f.cc.trim().length>3,1,'Componente crítico definido.','Qual é o componente crítico? Sem ele o título é mentira e o vídeo não existe.');
a(f.ng.trim().length>3,1,'Riscos declarados.','Escreva o que pode dar errado. Falar só o lado bom esconde o problema até ser tarde.');
return{s:r.reduce((s,x)=>s+(x.ok?x.pt:0),0),r}}
const V0=()=>{const e=evT(F);let h=`<div class="card"><b>Ideia</b><p class="k">Só o título é obrigatório. Os campos opcionais melhoram a nota e o diagnóstico.</p>
<input id="f_t" value="${E(F.t)}" placeholder="Título (a promessa)">
<details${F.th||F.cc||F.ng?' open':''}><summary class="y">Opcional: capa, componente crítico, negativos, formato</summary><input id="f_th" value="${E(F.th)}" placeholder="Capa ou primeiro frame: o que aparece na tela?">
<input id="f_cc" value="${E(F.cc)}" placeholder="Componente crítico: sem isso não existe vídeo">
<input id="f_ng" value="${E(F.ng)}" placeholder="Negativos: por que isso pode dar errado?">
<span class="k">Formato</span><select id="f_fm">${opts(FM,F.fm)}</select>
<span class="k">Variável que este vídeo testa (mude uma por vez)</span><select id="f_va">${opts(VA,F.va)}</select></details>
<button class="p" onclick="avaliar()">Avaliar</button><button class="p" onclick="addIdea()">Salvar na fila</button></div>`;
if(e)h+=`<div class="card"><b class="y">Nota ${e.s}/10</b>${e.r.map(x=>`<div class="${x.ok?'ok':'bad'}">${x.ok?'✓':'✗'} ${E(x.m)}</div>`).join('')}</div>`;
const l=D.i.slice().sort((a,b)=>b.c.localeCompare(a.c))[0];if(l&&l.fm===F.fm&&F.t.trim())h+=`<div class="card bad">Mesmo formato do último vídeo da fila. Formato repetido em sequência cansa: alterne.</div>`;return h};
window.avaliar=()=>draw();
window.addIdea=()=>{if(!F.t.trim())return toast('Escreva o título.');D.i.unshift({id:uid(),...F,t:F.t.trim(),c:new Date().toISOString(),status:'ideia',script:'',m:{}});save();F=blank();tab=0;draw();toast('Salvo na fila.')};

/* 2. ROTEIRO: tempo por trecho e regras de retenção */
const TELL=/(vou (te )?(mostrar|contar|explicar)|neste v[ií]deo|nesse v[ií]deo|antes de come[cç]ar)/i,GREET=/^(oi|ol[aá]|fala|e a[ií]|bom dia|boa noite|hoje)\b/i,FILL=/\b(ent[aã]o|tipo|basicamente|na verdade|vamos l[aá]|enfim)\b/i;
const END=/(obrigad|[eé] isso( a[ií])?|at[eé] a pr[oó]xima|tchau|nos vemos|espero que|inscreva)/i,TURN=/\?|\d|\b(mas|por[eé]m|s[oó] que|at[eé] que|de repente|ningu[eé]m|nunca)\b/i;
function evR(txt,du,title){const L=txt.split('\n').map(x=>x.trim()).filter(Boolean);if(!L.length)return null;let c=0;
const B=L.map(l=>{const n=l.split(/\s+/).length,s=n/2.5,o={l,n,a:c,b:c+s,f:[]};c+=s;return o}),T=c,g=[],b0=B[0];
if(b0.n>14)b0.f.push('Gancho longo: o primeiro trecho tem que prender em ~5 s.');
if(GREET.test(b0.l)||TELL.test(b0.l))b0.f.push('Abre com saudação ou aviso. Comece pela promessa ou pelo fato mais forte.');
if(title&&!wd(title).some(w=>wd(B.slice(0,2).map(x=>x.l).join(' ')).includes(w)))g.push('Os primeiros trechos não retomam a promessa do título. Quebrou a expectativa, o espectador sai.');
B.forEach(x=>{if(x.n>15)x.f.push('Trecho pesado (>6 s): divida ou troque a imagem.');if(x.a<10&&TELL.test(x.l)&&x!==b0)x.f.push('Está avisando em vez de mostrar. Mostre.');if(FILL.test(x.l))x.f.push('Enrolação: corte.')});
if(B.length>=4&&!B.some(x=>x.a/T>=.35&&x.a/T<=.65&&TURN.test(x.l)))g.push('Sem virada perto da metade. Coloque aí o momento mais forte para reengajar.');
const z=B[B.length-1];if(END.test(z.l))z.f.push('Despedida no fim. Termine abrupto, no resultado ou na revelação.');
g.push(T>du?`Estoura ${(T-du).toFixed(0)} s. Corte ~${Math.ceil((T-du)*2.5)} palavras.`:`Cabe: ~${T.toFixed(0)} s de ${du} s.`);return{B,g,T}}
function lk(it){const q=(R.q||'').trim()||(it?it.t:'');let h=`<div class="card"><b>Achar imagens e vídeos</b><p class="k">Escreva em português. Pexels, Pixabay e Google Imagens entendem português. Os outros funcionam melhor em inglês: use o link de tradução.</p><input id="r_q" value="${E(R.q||'')}" placeholder="Termo de busca (ex.: edição de vídeo com IA)"><button class="s" onclick="draw()">Gerar links</button>`;
if(!q)return h+'<span class="k">Escolha uma ideia ou escreva o termo.</span></div>';
const u=encodeURIComponent(q),L=[['Pexels (vídeos)',`https://www.pexels.com/pt-br/procurar/videos/${u}/`],['Pexels (fotos)',`https://www.pexels.com/pt-br/procurar/${u}/`],['Pixabay (vídeos)',`https://pixabay.com/pt/videos/search/${u}/`],['Pixabay (imagens)',`https://pixabay.com/pt/images/search/${u}/`],['Traduzir termo para inglês',`https://translate.google.com/?sl=pt&tl=en&text=${u}&op=translate`],['Unsplash (inglês)',`https://unsplash.com/s/photos/${u}`],['Mixkit (inglês)',`https://mixkit.co/free-stock-video/${u}/`],['Coverr (inglês)',`https://coverr.co/s?q=${u}`],['Wikimedia Commons',`https://commons.wikimedia.org/w/index.php?search=${u}&ns6=1`],['Google Imagens (uso comercial)',`https://www.google.com/search?tbm=isch&q=${u}&tbs=sur:fmc`]];
return h+'<div>'+L.map(([n,l])=>`<a href="${l}" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;margin:4px 4px 4px 0;padding:8px 12px;border:1px solid var(--y);border-radius:4px">${n}</a>`).join('')+'</div><p class="k">Grátis não é livre de regras: confira a licença de cada arquivo, evite rostos identificáveis e marcas, e dê crédito quando a licença pedir.</p></div>'}
const V2=()=>{const q=D.i.filter(x=>x.status!=='publicado');let h=`<div class="card"><b>Roteiro</b><p class="k">Um trecho por linha. O app calcula o tempo (150 palavras por minuto) e aponta onde o espectador tende a sair.</p>
<select id="r_id"><option value="">Escolha uma ideia da fila</option>${q.map(x=>`<option value="${x.id}"${x.id===R.id?' selected':''}>${E(x.t)}</option>`).join('')}</select>
<span class="k">Duração (segundos)</span><select id="r_du">${opts(['15','20','30','45','60'],R.du)}</select>
<textarea id="r_txt" rows="9" placeholder="Linha 1: gancho&#10;Linhas seguintes: fatos e viradas&#10;Última linha: resultado">${E(R.txt)}</textarea>
<button class="p" onclick="draw()">Analisar</button><button class="s" onclick="saveR()">Salvar no vídeo</button></div>`;
const it=find(R.id),e=evR(R.txt,+R.du,it?it.t:'');h+=lk(it);if(!e)return h;
h+=`<div class="card"><b>Análise</b>${e.g.map(x=>`<div>• ${E(x)}</div>`).join('')}</div><div class="card sc"><table><tr><th>Tempo</th><th>Trecho</th><th>Alerta</th></tr>${e.B.map(x=>`<tr><td>${x.a.toFixed(0)}–${x.b.toFixed(0)} s</td><td>${E(x.l)}</td><td class="bad">${E(x.f.join(' '))||'<span class="ok">ok</span>'}</td></tr>`).join('')}</table></div><button class="s" onclick="cpR()">Copiar com tempos</button>`;return h};
window.saveR=()=>{const it=find(R.id);if(!it)return toast('Escolha uma ideia da fila.');it.script=R.txt;if(it.status==='ideia')it.status='roteiro';save();toast('Roteiro salvo.')};
window.cpR=()=>{const e=evR(R.txt,+R.du,'');if(e)copy(e.B.map(x=>`[${x.a.toFixed(0)}-${x.b.toFixed(0)} s] ${x.l}`).join('\n'))};

/* 3. RESULTADOS: nota x/10 contra os 9 anteriores e diagnóstico */
function nota(it){const p=D.i.filter(x=>x.status==='publicado'&&x.id!==it.id&&x.pl===it.pl&&x.m.v48!=null&&x.pd<=it.pd).sort((a,b)=>b.pd.localeCompare(a.pd)).slice(0,9);return{r:1+p.filter(x=>x.m.v48>it.m.v48).length,n:p.length+1}}
function diag(it){if(it.m.v48==null)return null;const B=D.i.filter(x=>x.status==='publicado'&&x.m.v48!=null&&x.id!==it.id);
if(B.length<3)return{t:`Base pequena: faltam ${3-B.length} vídeo(s) medidos para comparar. Sem comparação, qualquer leitura é palpite.`};
const mv=med(B.map(x=>x.m.v48)),ms=med(B.map(x=>x.m.st)),ma=med(B.map(x=>x.m.ap)),m=it.m;
if(m.st==null&&m.ap==null)return{t:'Preencha "% que ficou" e "% assistido" para diagnosticar.'};
if(m.st!=null&&ms!=null&&m.st<ms-5)return{t:'Perde gente logo no início (viram e deslizaram). O problema está no gancho, título ou capa. Reescreva só o gancho.',v:VA[0]};
if(m.ap!=null&&ma!=null&&m.ap<ma-5)return{t:'Entra bem, mas sai no meio. Tem enrolação ou falta virada perto de 50%. Corte e reforce o meio.',v:VA[3]};
if(m.v48<mv)return{t:'Retenção normal, entrega baixa: tema, título ou capa não despertou clique. Mantenha o roteiro e teste outro título.',v:VA[1]};
return{t:'Acima da sua mediana, sem queda clara. Repita o formato e mude UMA variável (o tema) para saber a causa.',v:VA[5]}}
const V3=()=>{const q=D.i.filter(x=>x.status!=='publicado');let h=`<div class="card"><b>Publicar</b><select id="p_id"><option value="">Escolha um vídeo da fila</option>${q.map(x=>`<option value="${x.id}"${x.id===P.id?' selected':''}>${E(x.t)}</option>`).join('')}</select>
<div class="g"><select id="p_pl">${opts(PL,P.pl)}</select><input id="p_d" type="date" value="${P.d}"><input id="p_du" inputmode="numeric" value="${E(P.du)}" placeholder="Duração (s)"></div><button class="p" onclick="pub()">Marcar como publicado</button></div>`;
const L=D.i.filter(x=>x.status==='publicado').sort((a,b)=>b.pd.localeCompare(a.pd));
h+=L.map(x=>{const n=x.m.v48!=null?nota(x):null,d=diag(x),f=(k,l,md)=>`<div><span class="k">${l}</span><input id="m_${x.id}_${k}" inputmode="${md}" value="${E(x.m[k]??'')}"></div>`;
return`<div class="card"><b>${E(x.t)}</b><br><span class="k">${x.pd.split('-').reverse().join('/')} · ${E(x.pl)} · testou: ${E(x.va)}${n?` · nota <b class="y">${n.r}/${n.n>=10?10:n.n}</b>${n.n<10?' (base pequena)':''}`:''}</span>
<div class="g">${f('v48','Views em 48 h','numeric')}${f('st','% que ficou (não deslizou)','decimal')}${f('ap','% assistido médio','decimal')}${f('v7','Views em 7 dias','numeric')}</div>
<button class="p" onclick="saveM('${x.id}')">Salvar métricas</button><button class="s" onclick="del('${x.id}')">Remover</button>${d?`<div class="y">${E(d.t)}</div>${d.v?`<div class="k">Próxima variável a testar: ${E(d.v)}.</div>`:''}`:''}</div>`}).join('');
return h+(L.length?'<p class="k">Onde achar: YouTube Studio > Análises > Conteúdo; Facebook > Insights. Padrões com menos de 5 vídeos são hipótese, não causa.</p>':'')};
window.pub=()=>{const it=find(P.id);if(!it)return toast('Escolha um vídeo da fila.');Object.assign(it,{status:'publicado',pl:P.pl,pd:P.d||today(),du:num(P.du)});save();P.id='';draw()};
window.saveM=id=>{const it=find(id),g=k=>num($('#m_'+id+'_'+k).value);if(!it)return;const st=g('st'),ap=g('ap');if((st!=null&&st>100)||(ap!=null&&ap>100))return toast('Percentuais ficam entre 0 e 100.');it.m={v48:g('v48'),st,ap,v7:g('v7')};save();toast('Métricas salvas.');draw()};
window.del=id=>{if(confirm('Remover este vídeo?')){D.i=D.i.filter(x=>x.id!==id);save();draw()}};

/* 0. HOJE */
function prox(A,M){const x=A.find(i=>i.status==='roteiro'||i.status==='gravado'),n=A.find(i=>i.status==='ideia');let t,b;
if(M.length){t='Anote os números de "'+M[0].t+'" (já passaram 48 h).';b='<button class="p" onclick="tab=3;draw()">Anotar números</button>'}
else if(x){t='Produza e publique "'+x.t+'", depois marque como publicado.';b=`<button class="p" onclick="P.id='${x.id}';tab=3;draw()">Publicar</button>`}
else if(n){t='Escreva o roteiro de "'+n.t+'".';b=`<button class="p" onclick="R={id:'${n.id}',txt:'',du:R.du};tab=2;draw()">Escrever roteiro</button>`}
else{t='Escreva o título do seu primeiro vídeo. Só isso.';b='<button class="p" onclick="tab=1;draw()">Cadastrar ideia</button>'}
return`<div class="card"><b class="y">Próximo passo</b><br>${E(t)}<br>${b}</div>`}
const V1=()=>{const A=D.i.filter(x=>x.status!=='publicado'),M=D.i.filter(x=>x.status==='publicado'&&x.m.v48==null&&ageD(x.pd)>=2);
const last=D.i.filter(x=>x.status==='publicado'&&x.m.v48!=null).sort((a,b)=>b.pd.localeCompare(a.pd))[0],d=last&&diag(last);
let h=prox(A,M);if(M.length)h+=`<div class="card"><b class="y">Medir agora (48 h já passaram)</b>${M.map(x=>`<div>• ${E(x.t)}</div>`).join('')}<button class="s" onclick="tab=3;draw()">Anotar números</button></div>`;
if(d)h+=`<div class="card"><b>Última leitura</b><br>${E(last.t)}<br>${E(d.t)}${d.v?`<br><span class="k">Próximo teste: mude só isto: ${E(d.v)}.</span>`:''}</div>`;
if(A.length<3)h+=`<div class="card bad">${A.length} ideia(s) em andamento. Com menos de 3 você publica no improviso. Tenha sempre vários vídeos em fases diferentes.</div>`;
h+=`<div class="card"><b>Em andamento</b>${A.length?'':'<br><span class="k">Nada ainda. Comece pela aba Ideia.</span>'}</div>`;
h+=A.map(x=>`<div class="card"><b>${E(x.t)}</b><br><span class="k">${E(x.fm)} · testa: ${E(x.va)}</span>${x.cc?`<br><span class="k">Crítico: ${E(x.cc)}</span>`:''}<select onchange="setSt('${x.id}',this.value)">${opts(ST.slice(0,3),x.status)}</select><button class="s" onclick="R={id:'${x.id}',txt:find('${x.id}').script||'',du:R.du};tab=2;draw()">Roteiro</button><button class="s" onclick="P.id='${x.id}';tab=3;draw()">Publicar</button><button class="s" onclick="del('${x.id}')">Apagar</button></div>`).join('');
return h+`<div class="card"><b>Backup</b><p class="k">Os dados ficam só neste navegador. Limpar o navegador apaga tudo.</p><button class="s" onclick="bk()">Exportar</button><input id="imp" type="file" accept=".json" onchange="im(this)"></div>`};
window.setSt=(id,s)=>{const it=find(id);if(it){it.status=s;save()}};
window.bk=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='viral-backup-'+today()+'.json';a.click()};
window.im=el=>{const f=el.files[0];if(!f)return;f.text().then(t=>{const j=JSON.parse(t);if(!Array.isArray(j.i))throw 0;D=j;save();draw();toast('Backup importado.')}).catch(()=>toast('Arquivo inválido.'))};

/* base */
const TABS=['Hoje','Ideia','Roteiro','Resultados'],VW=[V1,V0,V2,V3];
document.addEventListener('input',e=>{const i=e.target.id||'',k=i.slice(2),v=e.target.value;if(i.startsWith('f_'))F[k]=v;else if(i.startsWith('r_')&&k!=='id')R[k]=v;else if(i.startsWith('p_')&&k!=='id')P[k]=v});
document.addEventListener('change',e=>{const i=e.target.id||'',v=e.target.value;if(i==='r_id'){R.id=v;const it=find(v);if(it)R.txt=it.script||'';draw()}else if(i==='p_id')P.id=v});
function draw(){$('#n').innerHTML=TABS.map((t,i)=>`<button class="${i===tab?'on':''}" onclick="tab=${i};draw()">${t}</button>`).join('');try{$('#a').innerHTML=VW[tab]()}catch(e){$('#a').innerHTML='<div class="card bad">Erro: '+E(e.message)+'</div>'}}
draw();
</script></body></html>
