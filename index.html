<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Viral Intelligence</title>
<style>
:root{--y:#FFD60A;--p:#161616;--l:#2e2e2e;--m:#a9a9a9}
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:15px/1.5 system-ui,sans-serif}
.tape{height:10px;background:repeating-linear-gradient(-45deg,var(--y) 0 14px,#000 14px 28px)}
h1,h2,h3{font-family:'Arial Narrow','Roboto Condensed',Impact,sans-serif;margin:.3em 0}h1{font-size:26px}
header{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.k{color:var(--m);font-size:13px}.bad{color:#ff7b7b}.ok{color:#7ee787}.y{color:var(--y)}

</style></head><body>
<div class="tape"></div>
<header><h1>YouTube Viral Intelligence</h1><span class="k" id="st"></span></header>
<nav id="nav"></nav><main id="app"></main><div id="toast"></div>
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const S={cid:ls('cid',''),tok:null,ch:null,ok:false,vids:[],an:null,anErr:'',sync:null,comps:ls('comps',[]),cd:[],cs:{},hist:ls('hist',[]),tab:0,busy:false};
const SC='https://www.googleapis.com/auth/youtube.readonly https://www.googleapis.com/auth/yt-analytics.readonly',Y='https://www.googleapis.com/youtube/v3/';
const TABS=['Visão geral','Auditoria do canal','Oportunidades virais','Concorrentes','Laboratório de ideias','Criador de Shorts','Revisão de vídeos','Resultados e aprendizado','Plano de ação','Configurações'];
const med=a=>{a=a.filter(x=>x!=null&&!isNaN(x)).sort((x,y)=>x-y);return a.length?a[a.length>>1]:null};
const age=v=>Math.max(1,(Date.now()-new Date(v.d))/864e5),vpd=v=>v.v/age(v),isS=v=>v.s<=180;
const fmt=n=>n==null?'—':n>=1e6?(n/1e6).toFixed(1)+' mi':n>=1e3?(n/1e3).toFixed(1)+' mil':Math.round(n)+'';
const pc=n=>n==null?'—':(n*100).toFixed(2)+'%',p1=n=>n==null?'—':n.toFixed(1)+'%';
const dl=(a,b)=>a==null||b==null||!b?'sem base':((a-b)/b*100>=0?'+':'')+((a-b)/b*100).toFixed(0)+'%';
const dur=s=>{const m=/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(s)||[];return(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0)};
const words=t=>(t.toLowerCase().match(/[\p{L}\d]+/gu)||[]).filter(w=>w.length>3&&!STOP.has(w));
const STOP=new Set('sobre para como mais mas pelo pela pelos pelas esse essa isso este esta tudo todo toda muito quando onde porque então ainda depois antes entre desde mesmo seus suas caso casos'.split(' '));
const NICHE=/crime|assassin|desapare|mist[ée]rio|investig|pol[ií]cia|morte|suspeit|serial|chacina|sequestr|arquiv|culpad|v[ií]tima/i;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',5000)}
async function api(u){const r=await fetch(u,{headers:{Authorization:'Bearer '+S.tok}});const j=await r.json().catch(()=>({}));if(r.status===401)throw new Error('Sessão expirou. Reconecte em Configurações.');if(!r.ok)throw new Error((j.error&&j.error.message)||'Erro '+r.status);return j}
async function uploads(pl,max){let ids=[],pt='';while(ids.length<max){const j=await api(`${Y}playlistItems?part=contentDetails&maxResults=50&playlistId=${pl}${pt?'&pageToken='+pt:''}`);ids.push(...j.items.map(i=>i.contentDetails.videoId));pt=j.nextPageToken;if(!pt)break}
let o=[];for(let i=0;i<ids.length;i+=50){const j=await api(`${Y}videos?part=snippet,statistics,contentDetails&id=${ids.slice(i,i+50).join(',')}`);o.push(...j.items.map(x=>({id:x.id,t:x.snippet.title,d:x.snippet.publishedAt,s:dur(x.contentDetails.duration),v:+x.statistics.viewCount||0,l:x.statistics.likeCount==null?null:+x.statistics.likeCount,c:x.statistics.commentCount==null?null:+x.statistics.commentCount})))}return o}
function connect(){if(!S.cid)return toast('Cole o Client ID em Configurações.');if(!window.google)return toast('Biblioteca do Google não carregou. Verifique a internet.');
google.accounts.oauth2.initTokenClient({client_id:S.cid,scope:SC,callback:async r=>{if(r.error)return toast('Erro: '+r.error);S.tok=r.access_token;try{const j=await api(Y+'channels?part=snippet,contentDetails,statistics&mine=true');if(!j.items)throw new Error('Nenhum canal do YouTube nesta conta.');S.ch=j.items[0];S.ok=false;draw()}catch(e){toast(e.message)}}}).requestAccessToken()}
async function confirmCh(){S.ok=true;await syncAll()}
async function syncAll(){if(!S.ok)return;S.busy=true;draw();try{S.vids=await uploads(S.ch.contentDetails.relatedPlaylists.uploads,200);await loadAn();await loadComps();S.sync=new Date();hist()}catch(e){toast(e.message)}S.busy=false;draw()}
async function loadAn(){const d=x=>new Date(Date.now()-x*864e5).toISOString().slice(0,10);try{const j=await api(`https://youtubeanalytics.googleapis.com/v2/reports?ids=channel==MINE&startDate=${d(90)}&endDate=${d(1)}&dimensions=video&metrics=views,averageViewDuration,averageViewPercentage,subscribersGained,subscribersLost,shares&sort=-views&maxResults=200`);S.an={};(j.rows||[]).forEach(r=>S.an[r[0]]={v:r[1],ad:r[2],ap:r[3],sg:r[4],sl:r[5],sh:r[6]});S.anErr=''}catch(e){S.an=null;S.anErr=e.message}}
async function loadComps(){S.cd=[];S.cs={};for(const c of S.comps){try{const vs=await uploads(c.u,50),b={};[0,1].forEach(f=>b[f]=med(vs.filter(v=>(+isS(v)===f)&&age(v)>=3).map(vpd)));
vs.forEach(v=>S.cd.push({...v,ch:c.n,ratio:b[+isS(v)]?vpd(v)/b[+isS(v)]:null}));const sp=Math.max(1,(Date.now()-new Date(vs[vs.length-1].d))/6048e5);
S.cs[c.id]={n:vs.length,f:vs.length/sp,sh:vs.filter(isS).length/vs.length,q:vs.filter(v=>/\?/.test(v.t)).length/vs.length,num:vs.filter(v=>/\d/.test(v.t)).length/vs.length}}catch(e){toast(c.n+': '+e.message)}}}
async function addComp(){try{const q=$('#cq').value.trim(),m=q.match(/@[\w.\-]+/),c=q.match(/UC[\w-]{22}/);if(!m&&!c)throw new Error('Use @handle, link do canal ou ID que começa com UC.');
const j=await api(`${Y}channels?part=snippet,contentDetails&${m?'forHandle='+encodeURIComponent(m[0]):'id='+c[0]}`);if(!j.items)throw new Error('Canal não encontrado.');const x=j.items[0];if(x.id===S.ch?.id)throw new Error('Esse é o seu canal.');
if(!S.comps.find(k=>k.id===x.id)){S.comps.push({id:x.id,n:x.snippet.title,u:x.contentDetails.relatedPlaylists.uploads});sv('comps',S.comps)}S.busy=true;draw();await loadComps();S.busy=false;draw()}catch(e){toast(e.message)}}
async function discover(){try{const j=await api(`${Y}search?part=snippet&type=channel&maxResults=8&regionCode=BR&relevanceLanguage=pt&q=${encodeURIComponent('crimes reais casos criminais')}`);$('#disc').innerHTML=j.items.map(i=>`<div class="card">${E(i.snippet.title)}<br><span class="k">${E(i.snippet.channelId)}</span> <button class="s" onclick="$('#cq').value='${i.snippet.channelId}';addComp()">Adicionar</button></div>`).join('')}catch(e){toast(e.message)}}
function rmComp(i){S.comps.splice(i,1);sv('comps',S.comps);loadComps().then(draw)}
function disc(){if(S.tok&&window.google)google.accounts.oauth2.revoke(S.tok);S.tok=null;S.ch=null;S.ok=false;S.vids=[];S.an=null;S.cd=[];draw()}
function wipe(){['cid','comps','hist'].forEach(k=>localStorage.removeItem(k));S.cid='';S.comps=[];S.hist=[];disc()}
/* análise */
const win=(a,b)=>S.vids.filter(v=>{const g=age(v);return g>a&&g<=b});
function grp(L){return{n:L.length,mv:med(L.map(v=>v.v)),mp:med(L.map(vpd)),lr:med(L.filter(v=>v.l!=null&&v.v).map(v=>v.l/v.v)),cr:med(L.filter(v=>v.c!=null&&v.v).map(v=>v.c/v.v)),ap:S.an?med(L.map(v=>S.an[v.id]?.ap)):null,sub:S.an?L.reduce((s,v)=>s+(S.an[v.id]?S.an[v.id].sg-S.an[v.id].sl:0),0):null,tv:L.reduce((s,v)=>s+v.v,0)}}
function outl(f){const L=S.vids.filter(v=>(+isS(v)===f)&&age(v)>=3),b=med(L.map(vpd));return{b,L:L.map(v=>({...v,r:b?vpd(v)/b:null}))}}
function report(){const P=[],O=[],R=[];const G={};[30,60,90].forEach(N=>G[N]={s:grp(win(0,N).filter(isS)),l:grp(win(0,N).filter(v=>!isS(v))),ps:grp(win(N,2*N).filter(isS)),pl:grp(win(N,2*N).filter(v=>!isS(v)))});
const s=G[30].s,l=G[30].l;let md=`## Diagnóstico atual\n`;
md+=`- Canal: ${S.ch.snippet.title}. Sincronizado em ${S.sync.toLocaleString('pt-BR')}.\n- Últimos 30 dias: ${s.n} Shorts (${(s.n/(30/7)).toFixed(1)}/semana), mediana ${fmt(s.mv)} views, ${fmt(s.mp)} views/dia. Variação de views/dia vs 30 dias anteriores: ${dl(s.mp,G[30].ps.mp)}.\n- Vídeos longos em 30 dias: ${l.n}, mediana ${fmt(l.mv)} views.\n`;
if(!S.an)md+=`- Métricas privadas indisponíveis (${S.anErr}). Retenção e inscritos: veja Studio > Análises > Conteúdo.\n`;
if(s.n<4)R.push('Amostra pequena (menos de 4 Shorts em 30 dias): conclusões com baixa confiança.');
if(s.n/(30/7)<3)P.push(`Frequência baixa: ${(s.n/(30/7)).toFixed(1)} Shorts/semana. Hipótese: poucas tentativas para achar o que funciona (só aumente se mantiver qualidade).`);
if(G[30].ps.mp&&s.mp<G[30].ps.mp*.8)P.push(`Queda de ${Math.abs(((s.mp-G[30].ps.mp)/G[30].ps.mp*100)).toFixed(0)}% nas views/dia dos Shorts vs período anterior.`);
const g9=G[90].s;if(g9.ap!=null&&g9.ap<70)P.push(`% médio assistido dos Shorts em ${g9.ap.toFixed(0)}%. Hipótese: gancho ou ritmo perdendo público cedo; compare com seus melhores vídeos.`);
if(g9.sub!=null&&g9.tv&&g9.sub/g9.tv*1000<2)P.push(`Conversão baixa em inscritos (${(g9.sub/g9.tv*1000).toFixed(1)} por mil views). Hipótese: falta promessa de continuidade/série.`);
if(g9.cr!=null&&g9.cr<.002)P.push('Poucos comentários por view. Teste uma pergunta específica no final e no comentário fixado.');
if(!S.vids.some(v=>!isS(v)))O.push('Nenhum vídeo longo publicado: formato ainda não testado.');
const os=outl(1).L.filter(v=>v.r>=2).sort((a,b)=>b.r-a.r).slice(0,3);os.forEach(v=>O.push(`Outlier positivo: "${v.t}" (${v.r.toFixed(1)}× a mediana de Shorts). Estude gancho, tema e primeiros 3 s.`));
if(!O.length)O.push('Cadastre concorrentes para achar oportunidades externas (aba Concorrentes).');
if(!P.length)P.push('Nenhum problema claro nos dados disponíveis; foque em testar uma variável por vídeo.');
md+=`\n## Principais problemas\n${P.map(x=>'- '+x).join('\n')}\n\n## Oportunidades identificadas\n${O.map(x=>'- '+x).join('\n')}\n\n## Três prioridades\n${P.slice(0,3).map((x,i)=>`- ${i+1}. ${x}`).join('\n')}\n\n## Plano para 7 dias\n`;
md+=['Dia 1: assistir os 3 maiores outliers e anotar os 5 primeiros segundos de cada.','Dia 2: cadastrar 5+ concorrentes e sincronizar.','Dia 3: escolher 1 oportunidade e montar o pacote no Criador de Shorts.','Dia 4: revisar o roteiro no modo Revisão e publicar.','Dia 5: medir 48 h (views/dia, retenção no Studio).','Dia 6: publicar 2º Short mudando UMA variável (gancho).','Dia 7: comparar os dois com a mediana do formato e decidir o próximo.'].map(x=>'- '+x).join('\n');
if(R.length)md+=`\n\n## Ressalvas\n${R.map(x=>'- '+x).join('\n')}\n- Correlação não é causa: padrões observados são hipóteses.`;return{md,P,O,G}}
function md2h(m){return m.split('\n').map(l=>l.startsWith('## ')?`<h3>${E(l.slice(3))}</h3>`:l.startsWith('- ')?`<div>• ${E(l.slice(2))}</div>`:l?`<p>${E(l)}</p>`:'').join('')}
function opps(maxAge,minR){return S.cd.filter(v=>age(v)<=maxAge&&v.ratio!=null&&v.ratio>=minR).map(v=>{const w=new Set(words(v.t)),sim=S.cd.filter(o=>o.id!==v.id&&words(o.t).filter(x=>w.has(x)).length>=2),chs=new Set(sim.map(o=>o.ch));
const c={dem:Math.min(1,Math.log10(vpd(v)+1)/4),spd:Math.min(1,v.ratio/5),fit:NICHE.test(v.t)?1:.3,orig:1-Math.min(1,sim.length/5),fea:v.s<=60?1:v.s<=180?.8:.4,comp:1-Math.min(1,chs.size/4)};
return{v,c,n:sim.length,k:[...w].sort((a,b)=>b.length-a.length).slice(0,3),score:Math.round(100*(.25*c.dem+.25*c.spd+.15*c.fit+.15*c.orig+.1*c.fea+.1*c.comp))}}).sort((a,b)=>b.score-a.score)}
const link=v=>`<a href="https://youtu.be/${v.id}" target="_blank" rel="noopener">${E(v.t)}</a>`;
function acts(){const a=[],o=opps(30,1.5)[0],r=S.vids.length?report():null,re=new Date(Date.now()+3*864e5).toLocaleDateString('pt-BR');
a.push(o?{t:`Produzir 1 Short com ângulo próprio sobre: ${o.k.join(', ')}`,w:`"${o.v.t}" (${o.v.ch}) tem ${fmt(vpd(o.v))} views/dia, ${o.v.ratio.toFixed(1)}× a mediana do próprio canal (observado em ${new Date(o.v.d).toLocaleDateString('pt-BR')}).`,h:'2 a 3 h',m:'views em 48 h, % assistido, inscritos/mil views',r:re}:{t:'Cadastrar 5 canais concorrentes',w:'Sem concorrentes não há base para detectar oportunidades.',h:'15 min',m:'canais com dados',r:re});
a.push(r?{t:r.P[0],w:'Vem da auditoria dos seus dados.',h:'30 min',m:'indicador citado, 7 dias depois',r:re}:{t:'Sincronizar o canal',w:'Sem dados reais não há auditoria.',h:'2 min',m:'canal conectado',r:re});
const last=S.vids.slice().sort((x,y)=>new Date(y.d)-new Date(x.d))[0];a.push(last?{t:`Medir o último vídeo: "${last.t}"`,w:'Comparar com a mediana do formato evita decidir no achismo.',h:'10 min',m:'views/dia vs mediana',r:re}:{t:'Publicar o primeiro Short do plano',w:'Sem histórico, a primeira medição vem da publicação.',h:'2 a 3 h',m:'views em 48 h',r:re});return a}
function hist(){const d=new Date().toLocaleDateString('pt-BR');if(S.hist[0]?.d===d)return;S.hist.unshift({d,a:acts().map(x=>x.t)});S.hist=S.hist.slice(0,15);sv('hist',S.hist)}
/* telas */
const gate=()=>!S.ch?'<div class="card">Conecte seu canal em <b>Configurações</b>.</div>':!S.ok?'<div class="card">Confirme o canal em <b>Visão geral</b> antes de analisar.</div>':S.busy?'<div class="card">Sincronizando…</div>':!S.vids.length?'<div class="card">Nenhum vídeo encontrado.</div>':'';
const V=[
()=>{let h=`<div class="card"><b>Canal conectado:</b> ${S.ch?E(S.ch.snippet.title)+` <span class="k">(${S.ch.id})</span>`:'<span class="bad">nenhum</span>'}<br><span class="k">Última sincronização: ${S.sync?S.sync.toLocaleString('pt-BR'):'nunca'}</span><br><span class="k">Dados: vídeos públicos ${S.vids.length?'<span class="ok">disponíveis</span>':'—'}; Analytics privado ${S.an?'<span class="ok">disponível</span>':S.vids.length?'<span class="bad">indisponível</span> ('+E(S.anErr)+')':'—'}</span></div>`;
if(S.ch&&!S.ok)h+=`<div class="card">Este é o seu canal? Só depois de confirmar eu analiso dados.<br><button class="p" onclick="confirmCh()">Sim, é este</button><button class="s" onclick="disc()">Não, desconectar</button></div>`;
if(S.ok)h+=`<button class="p" onclick="syncAll()">Sincronizar agora</button>`;const g=gate();if(g&&S.ok)return h+g;if(!S.ok)return h;
h+=`<h2>O que fazer agora?</h2>`+acts().map((a,i)=>`<div class="card"><b class="y">${i+1}. ${E(a.t)}</b><br>${E(a.w)}<br><span class="k">Tempo: ${a.h} · Medir: ${a.m} · Reavaliar em ${a.r}</span></div>`).join('');
const L=S.vids.slice().sort((a,b)=>new Date(b.d)-new Date(a.d)).slice(0,24).reverse(),mx=Math.max(...L.map(vpd));return h+`<div class="card"><b>Views por dia dos últimos ${L.length} vídeos</b><div class="bars">${L.map(v=>`<i title="${E(v.t)}" style="height:${vpd(v)/mx*100}%"></i>`).join('')}</div><span class="k">Vídeos novos têm poucos dias de dados; compare com cuidado.</span></div>`},
()=>{const g=gate();if(g)return g;const r=report();let h=`<button class="p" onclick="dlr()">Exportar relatório (.md)</button><div class="card">${md2h(r.md)}</div><h3>Comparação por período</h3><div class="sc"><table><tr><th>Período</th><th>Formato</th><th>Vídeos</th><th>Views/dia (mediana)</th><th>vs anterior</th><th>Mediana views</th><th>Curtidas/view</th><th>% assistido</th><th>Inscritos líq.</th></tr>`;
[30,60,90].forEach(N=>[['Shorts',r.G[N].s,r.G[N].ps],['Longos',r.G[N].l,r.G[N].pl]].forEach(([f,c,p])=>h+=`<tr><td>${N} d</td><td>${f}</td><td>${c.n}</td><td>${fmt(c.mp)}</td><td>${dl(c.mp,p.mp)}</td><td>${fmt(c.mv)}</td><td>${pc(c.lr)}</td><td>${p1(c.ap)}</td><td>${c.sub==null?'—':c.sub}</td></tr>`));
h+=`</table></div><p class="k">"—" = dado indisponível (não é zero). Shorts = vídeos de até 3 min (critério aproximado; confira no Studio).</p><h3>Outliers (views/dia vs mediana do formato)</h3>`;
[1,0].forEach(f=>{const o=outl(f).L.filter(v=>v.r&&(v.r>=2||v.r<=.4)).sort((a,b)=>b.r-a.r);h+=`<div class="card"><b>${f?'Shorts':'Longos'}</b>${o.slice(0,4).map(v=>`<div>↑ ${v.r.toFixed(1)}× ${link(v)}</div>`).join('')}${o.slice(-3).filter(v=>v.r<=.4).map(v=>`<div>↓ ${v.r.toFixed(1)}× ${link(v)}</div>`).join('')||''}${o.length?'':'<span class="k">Sem outliers claros.</span>'}</div>`});return h},
()=>{if(!S.cd.length)return'<div class="card">Cadastre concorrentes na aba Concorrentes para detectar oportunidades.</div>';const o=opps(30,1.5);let h=`<div class="card k">Velocidade = views/dia médias desde a publicação vs mediana do próprio canal (1 coleta). Isto é <b>sinal observado</b>, não aceleração medida nem previsão de viralização. Pontuação: demanda 25, velocidade 25, adequação 15, originalidade 15, viabilidade 10, concorrência 10.</div>`;
if(!o.length)return h+'<div class="card">Nenhum vídeo recente com desempenho ≥1,5× o normal do canal. Isso também é informação.</div>';

function rv(){const t=$('#rt').value,s=$('#rs').value.trim();if(!s)return toast('Cole o roteiro.');const ss=s.split(/(?<=[.!?])\s+/).filter(Boolean),n=s.split(/\s+/).length,f=ss[0],fw=f.split(/\s+/).length,c=[],cl=x=>Math.max(0,Math.min(10,Math.round(x))),m=(r)=>(s.match(r)||[]).length;
